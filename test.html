<!DOCTYPE html>
<html>
<head>
  <title>RL Scheduler Live</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
    .alert {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>⚙️ RL OS Scheduler</h1>

  <div class="card">
    <h3>System State</h3>
    <p>CPU: <span id="cpu">0</span>%</p>
    <p>RAM: <span id="ram">0</span>%</p>
    <p>Queue: <span id="queue">0</span></p>
    <p>Completed: <span id="completed">0</span></p>
  </div>

  <div class="card">
    <h3>Decision</h3>
    <p id="decision">-</p>
  </div>

  <div class="card">
    <h3>Reward</h3>
    <p id="reward">0</p>
  </div>

  <button onclick="stressTest()">🔥 Stress Test</button>
  <button onclick="resetSim()">🔄 Reset</button>

  <script>
    const socket = io("http://localhost:5000");

    // 🔁 resource update
    socket.on("resource_update", data => {
      document.getElementById("cpu").innerText = data.cpu_used;
      document.getElementById("ram").innerText = data.ram_used;
      document.getElementById("queue").innerText = data.queue_length;
      document.getElementById("completed").innerText = data.completed_count;

      // simple alert effect
      if (data.cpu_used > 80 || data.ram_used > 80) {
        document.getElementById("cpu").classList.add("alert");
        document.getElementById("ram").classList.add("alert");
      } else {
        document.getElementById("cpu").classList.remove("alert");
        document.getElementById("ram").classList.remove("alert");
      }
    });

    // 🧠 decision
    socket.on("decision_made", data => {
      document.getElementById("decision").innerText = data.action;
    });

    // 🎯 reward
    socket.on("reward_update", data => {
      document.getElementById("reward").innerText = data.reward;
    });

    // 🔥 API calls
    function stressTest() {
      fetch("http://localhost:5000/api/stress-test");
    }

    function resetSim() {
      fetch("http://localhost:5000/api/reset");
    }
  </script>
</body>
</html>
