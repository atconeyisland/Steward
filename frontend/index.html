<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Steward — OS Resource Manager</title>

  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- Socket.IO CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#0d0f14"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="#0d0f14"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="#0d0f14"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#0d0f14" opacity="0.4"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">STEWARD</div>
        <div class="logo-sub">RL-POWERED OS RESOURCE MANAGER</div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="conn-status">CONNECTING...</span>
    </div>
  </header>

  <!-- ── Main content ── -->
  <main>

    <!-- Metric cards -->
    <div class="metric-grid">

      <div class="metric-card">
        <div class="metric-label">CPU Usage</div>
        <div class="metric-value cpu" id="cpu-val">0%</div>
        <div class="metric-bar"><div class="metric-bar-fill cpu" id="cpu-bar" style="width:0%"></div></div>
        <div class="metric-delta" id="cpu-delta">— waiting for data</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">RAM Usage</div>
        <div class="metric-value ram" id="ram-val">0%</div>
        <div class="metric-bar"><div class="metric-bar-fill ram" id="ram-bar" style="width:0%"></div></div>
        <div class="metric-delta" id="ram-delta">— waiting for data</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">Queue Length</div>
        <div class="metric-value queue" id="queue-val">0</div>
        <div class="metric-bar"><div class="metric-bar-fill queue" id="queue-bar" style="width:0%"></div></div>
        <div class="metric-delta" id="queue-delta">— waiting for data</div>
      </div>

    </div>

    <!-- Charts -->
    <div class="charts-grid">

      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">CPU Usage — Real Time</span>
          <span class="chart-live-badge">LIVE</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="cpuChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">RAM Usage — Real Time</span>
          <span class="chart-live-badge">LIVE</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="ramChart"></canvas>
        </div>
      </div>

    </div>

    <!-- Socket.IO event log -->
    <div class="log-card">
      <div class="log-header">
        <span class="log-title">Socket.IO Event Log</span>
        <button class="log-clear" onclick="clearLog()">Clear</button>
      </div>
      <div class="log-body" id="log"></div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
